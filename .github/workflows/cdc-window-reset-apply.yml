name: Apply CDC window reset fix

on:
  push:
    branches: [fix/cdc-window-reset]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cdc-window-reset
          fetch-depth: 0
      - name: Apply exact minimal patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('tooling/internal/contenthash/contenthash.go')
          s = p.read_text()
          old = '''\tfor i := 0; i < len(data); i++ {\n\t\tvar h uint64\n\t\tif i < WindowSize {\n\t\t\th = roll.add(data[i], 0, false)\n\t\t} else {\n\t\t\th = roll.add(data[i], data[i-WindowSize], true)\n\t\t}\n\t\tsize := i - start + 1\n'''
          new = '''\tfor i := 0; i < len(data); i++ {\n\t\tvar h uint64\n\t\trel := i - start\n\t\tif rel < WindowSize {\n\t\t\th = roll.add(data[i], 0, false)\n\t\t} else {\n\t\t\th = roll.add(data[i], data[i-WindowSize], true)\n\t\t}\n\t\tsize := i - start + 1\n'''
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif new in s:
              print('Patch already applied')
          else:
              raise SystemExit('Expected ChunkText block not found; refusing to edit')
      - uses: actions/setup-go@v5
        with:
          go-version-file: tooling/go.mod
      - name: Verify full contenthash package
        working-directory: tooling
        run: go test ./internal/contenthash
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch commit needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/internal/contenthash/contenthash.go
          git commit -m 'fix(contenthash): reset rolling window per chunk'
          git push origin HEAD:fix/cdc-window-reset
